name: Linux sandbox tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Allow Bubblewrap user namespaces under Ubuntu AppArmor
        shell: bash
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces by default. Grant
          # the permission to Bubblewrap only; do not relax the host-wide sysctl.
          if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" == "1" ]]; then
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              '' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' \
              '  userns,' \
              '  include if exists <local/bwrap>' \
              '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify sandbox launch
        run: ./bbj doctor --self-test
      - name: Validate bounded sandbox behaviors
        run: ./bbj benchmark --cgroups off

      - name: Measure launch overhead (bounded safe probes)
        run: |
          ./bbj measure --iterations 3 --cgroups off > /tmp/bbj-overhead.json
          python3 -m json.tool /tmp/bbj-overhead.json > /dev/null
